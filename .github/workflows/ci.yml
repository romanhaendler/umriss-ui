# What can be checked without a screenshot: lint, types, unit tests, build and the
# built entries (`check:dist`: the directive and the stylesheet import).
# The screenshot suite stays local - its baselines are taken on darwin
# (CONTRIBUTING.md, "First run") and would report every image as missing here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # ubuntu-latest would move to Ubuntu 26 on 19 Oct 2026; the runner is raised on purpose, not by the calendar.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:site
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm -r check:dist

  # The image is pinned by digest inside the script; the rule sets are vendored in
  # .semgrep/. Nothing is sent to the Semgrep app and the job holds no secrets.
  semgrep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/semgrep.sh

