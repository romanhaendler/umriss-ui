# What can be checked without a screenshot: lint, types, unit tests, build.
# The screenshot suite stays local - its baselines are taken on darwin
# (CONTRIBUTING.md, "First run") and would report every image as missing here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # ubuntu-latest would move to Ubuntu 26 on 19 Oct 2026; the runner is raised on purpose, not by the calendar.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
