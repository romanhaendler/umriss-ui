# NOT RUN YET: this job has never run on GitHub. The baselines were taken on the
# maintainer's Mac (-darwin); fonts on the runner may differ from his machine,
# so the first runs may report image diffs that are not regressions.
# The full visual suite (20-50 minutes), on macOS because the baselines are
# -darwin. Started by hand (Actions → Visual → Run workflow) until a run has
# been green; then `push: branches: [main]` goes back in beside the dispatch.
# Locally: `pnpm test:visual:quick <package>`.
name: Visual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm test:visual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results
          path: test-results/
