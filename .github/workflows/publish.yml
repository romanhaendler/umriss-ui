# Publishes every package whose version is not on npm yet, on each push to
# main (docs/releasing.md). A version is released by raising it in its
# package.json; the tag <dir>-v<version> is set here afterwards and triggers
# nothing. No token: npm trusts this workflow through OIDC (Trusted
# Publishing) and attaches the provenance itself.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Outside the environment, so a push that releases nothing waits for no one.
  find:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        # In dependency order: core and charts before what depends on them.
        # A new package is added here.
        run: |
          dirs=""
          for dir in core charts table schedule calculation; do
            name="$(node -p "require('./packages/$dir/package.json').name")"
            version="$(node -p "require('./packages/$dir/package.json').version")"
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is on npm"
            else
              echo "$name@$version is not - publishing"
              dirs="$dirs $dir"
            fi
          done
          echo "dirs=${dirs# }" >> "$GITHUB_OUTPUT"

  publish:
    needs: find
    if: needs.find.outputs.dirs != ''
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # Node 24 brings npm 11, which Trusted Publishing needs (>= 11.5.1).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build

      # pnpm packs (it rewrites the workspace: ranges), npm uploads (pnpm 9
      # cannot do Trusted Publishing). npm runs no lifecycle scripts on a
      # tarball, so prepublishOnly's work is the steps above and check:dist.
      # One package failing stops the rest; the next push picks them up.
      - name: Publish and tag
        env:
          DIRS: ${{ needs.find.outputs.dirs }}
        run: |
          for dir in $DIRS; do
            cd "$GITHUB_WORKSPACE/packages/$dir"
            version="$(node -p "require('./package.json').version")"
            case "$version" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
            pnpm run check:dist
            pnpm pack
            npm publish ./*.tgz --tag "$dist_tag"
            tag="$dir-v$version"
            git tag "$tag"
            git ls-remote --exit-code --tags origin "$tag" > /dev/null || git push origin "$tag"
          done
