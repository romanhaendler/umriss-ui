# Publishes every package whose version is not on npm yet, on each push to
# main (docs/releasing.md). A version is released by raising it in its
# package.json; the tag <dir>-v<version> is set here afterwards and triggers
# nothing. No token: npm trusts this workflow through OIDC (Trusted
# Publishing) and attaches the provenance itself.
#
# The rule: the job with the token runs no third-party code. `build` installs
# the dependencies and runs every check and script, but cannot mint a token;
# `publish` holds the token and only downloads the tarballs `build` packed and
# hands them to npm - no install, no package script.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Outside the environment, so a push that releases nothing waits for no one.
  find:
    runs-on: ubuntu-24.04
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        # In dependency order: core and charts before what depends on them.
        # A new package is added here.
        run: |
          dirs=""
          for dir in core charts table alarms schedule calculation dashboard; do
            name="$(node -p "require('./packages/$dir/package.json').name")"
            version="$(node -p "require('./packages/$dir/package.json').version")"
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is on npm"
            else
              echo "$name@$version is not - publishing"
              dirs="$dirs $dir"
            fi
          done
          echo "dirs=${dirs# }" >> "$GITHUB_OUTPUT"

  # No token and outside the environment: everything foreign runs here.
  build:
    needs: find
    if: needs.find.outputs.dirs != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:site
      - run: pnpm test:unit
      - run: pnpm build

      # pnpm packs because only pnpm rewrites the workspace: ranges. npm runs
      # no lifecycle scripts on a tarball, so prepublishOnly's work is the
      # steps above and check:dist. All tarballs land in one directory, named
      # <scope>-<name>-<version>.tgz by pnpm.
      - name: Check and pack
        env:
          DIRS: ${{ needs.find.outputs.dirs }}
        run: |
          mkdir "$GITHUB_WORKSPACE/tarballs"
          for dir in $DIRS; do
            cd "$GITHUB_WORKSPACE/packages/$dir"
            pnpm run check:dist
            pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: tarballs/*.tgz
          if-no-files-found: error

  # Holds the token: installs nothing and runs no package script.
  publish:
    needs: [find, build]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 24 brings npm 11, which Trusted Publishing needs (>= 11.5.1).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: tarballs

      # One package failing stops the rest; the next push picks them up.
      # `npm view` in `find` reports a version published minutes ago as
      # missing, so a push right after a release asks again; npm's refusal to
      # publish over an existing version is then the answer that it stands
      # there, and the package is tagged as if it had just gone out.
      # The tarball is named from the package's name and version, in the
      # order `find` gave, so the dependency order holds.
      - name: Publish and tag
        env:
          DIRS: ${{ needs.find.outputs.dirs }}
        run: |
          for dir in $DIRS; do
            name="$(node -p "require('./packages/$dir/package.json').name")"
            version="$(node -p "require('./packages/$dir/package.json').version")"
            tarball="tarballs/$(echo "${name#@}" | tr / -)-$version.tgz"
            case "$version" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
            if npm publish "./$tarball" --tag "$dist_tag" 2> publish.log; then
              cat publish.log >&2
            else
              cat publish.log >&2
              grep -q "cannot publish over the previously published versions" publish.log || exit 1
              echo "$dir@$version is on npm already - only tagged"
            fi
            tag="$dir-v$version"
            git tag "$tag"
            git ls-remote --exit-code --tags origin "$tag" > /dev/null || git push origin "$tag"
          done
