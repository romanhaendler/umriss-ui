# Checks that npm trusts this repository for every package, without publishing:
# it fetches each package's version already on npm and publishes it again. npm
# exchanges the workflow's identity for a token first; with a token it refuses
# the known version ("cannot publish over"), without one it asks for a login.
name: Trusted Publishing check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # Node 24 brings npm 11, which Trusted Publishing needs (>= 11.5.1).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Exchange and refuse, per package
        env:
          NPM_CONFIG_PROVENANCE: "false"
        run: |
          failed=0
          for pkg in core charts table alarms schedule calculation dashboard; do
            tarball="$(npm pack "@umriss-ui/$pkg@latest" --silent)"
            npm publish "./$tarball" --tag latest --loglevel verbose > publish.log 2>&1 || true
            if grep -q "Successfully retrieved and set token" publish.log && grep -q "cannot publish over the previously published versions" publish.log; then
              echo "$pkg: trusted - the token was issued and the known version refused"
            else
              echo "::error::$pkg: no token from npm"
              grep -E "oidc|ENEEDAUTH|E40[0-9]" publish.log || tail -20 publish.log
              failed=1
            fi
          done
          exit $failed
